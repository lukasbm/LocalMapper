[project]
name = "localmapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cgrtools-plus>=4.1.35",
    "dgl==1.1.3",
    "dgllife>=0.3.2",
    "fire>=0.7.0",
    "graphkit-learn>=0.2.1.post20240206154638",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pysmiles>=2.1.0",
    "rdkit>=2026.3.3",
    "torch==2.7.1+cu128; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tqdm>=4.66",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
